<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Café Victor Hugo — Smart Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17130f;--gold:#c79a3b;--cream:#f5efe5;--card:#fffdf9;--muted:#786f65;
  --danger:#a83232;--line:#e8dccb;--dark:#17130f;--soft:#efe5d6
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f7f2ea 0,#f3ecdf 100%);color:var(--ink);font-family:Cairo,Arial,sans-serif}
button,input{font-family:inherit}
button{touch-action:manipulation}
header{
  position:sticky;top:0;z-index:10;background:rgba(23,19,15,.96);color:#fff;
  border-bottom:1px solid #ffffff12;backdrop-filter:blur(14px)
}
.topbar{max-width:1280px;margin:auto;padding:13px 5% 10px}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brandWrap{display:flex;align-items:center;gap:12px;min-width:0}
.brandLogo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #ffffff28;background:#222;flex:0 0 auto}
.brand{font-family:"Playfair Display",serif;font-size:25px;line-height:1.05;white-space:nowrap}
.sub{opacity:.68;font-size:12px;margin-top:4px}
.siteLang{border:1px solid #ffffff30;background:#ffffff10;color:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;flex:0 0 auto}
.searchBar{display:flex;align-items:center;gap:9px;margin-top:12px}
.searchBar input{
  width:100%;border:1px solid #ffffff26;background:#ffffff0d;color:#fff;border-radius:16px;
  padding:11px 14px;font-size:15px;outline:none
}
.searchBar input::placeholder{color:#ffffff88}
nav{display:flex;gap:8px;overflow:auto;padding:10px 5% 13px;scrollbar-width:none;max-width:1280px;margin:auto}
nav::-webkit-scrollbar{display:none}
nav button{
  white-space:nowrap;border:1px solid #ffffff24;background:#ffffff0d;color:#fff;border-radius:999px;
  padding:8px 13px;cursor:pointer;font-size:13px;transition:.2s
}
nav button:hover{background:#ffffff18}
main{max-width:1280px;margin:auto;padding:22px 5% 60px}
.hero{
  position:relative;overflow:hidden;border-radius:28px;background:
    radial-gradient(circle at 75% 20%,#d9b56633,transparent 35%),
    linear-gradient(135deg,#201910,#3a2a18);
  color:#fff;padding:38px 34px;margin:6px 0 26px;min-height:210px;display:flex;align-items:center
}
.heroContent{max-width:700px;position:relative;z-index:2}
.heroEyebrow{display:inline-block;border:1px solid #ffffff30;background:#ffffff0e;border-radius:999px;padding:7px 11px;font-size:12px;margin-bottom:12px}
.hero h1{font-family:"Playfair Display",serif;font-size:44px;margin:0 0 10px;line-height:1.1}
.hero p{color:#ffffffb8;margin:0;line-height:1.8;max-width:650px}
.heroMark{
  position:absolute;inset-inline-end:-45px;bottom:-70px;width:240px;height:240px;border-radius:50%;
  border:1px solid #ffffff12;background:#ffffff07
}
.section-title{
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:"Playfair Display",serif;
  font-size:28px;margin:32px 0 14px;padding-bottom:9px;border-bottom:1px solid #d8c8b3
}
.section-count{font-family:Cairo,Arial,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 10px 30px #3e2b1110;position:relative;display:flex;flex-direction:column;min-width:0;
  transition:transform .2s ease,box-shadow .2s ease
}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px #3e2b1118}}
.foodImageWrap{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#dacdbb,#f1e7d9);overflow:hidden}
.foodImage{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s ease}
@media(hover:hover){.card:hover .foodImage{transform:scale(1.035)}}
.foodFallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;color:#8b7354;background:linear-gradient(135deg,#e9dece,#f8f1e7)}
.price{
  position:absolute;inset-inline-end:12px;top:12px;background:#17130fe8;color:#fff;border:1px solid #ffffff24;
  border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;backdrop-filter:blur(8px)
}
.signature{position:absolute;inset-inline-start:12px;top:12px;background:var(--gold);color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}
.cardBody{padding:16px;display:flex;flex-direction:column;flex:1}
.card h3{margin:0 0 7px;font-size:19px;line-height:1.45}
.desc{color:var(--muted);font-size:13px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:68px}
.voice{
  margin-top:14px;width:100%;border:0;border-radius:14px;padding:11px 13px;background:var(--dark);color:#fff;
  font-weight:700;cursor:pointer;transition:.2s
}
.voice:hover{background:#2b2118}
.emptyState{display:none;text-align:center;padding:45px 20px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.hidden{display:none}
.welcomeCard,.dialog{background:#fffdf9;border-radius:26px;max-width:500px;width:100%;box-shadow:0 25px 70px #0005}
.welcomeCard{padding:30px;text-align:center}
.welcomeCard h1{font-family:"Playfair Display",serif;margin:0 0 8px}
.welcomeCard p{color:var(--muted);line-height:1.7}
.languageGrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.languageChoice{border:1px solid #dccdb8;background:white;border-radius:16px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.languageChoice:hover{border-color:var(--gold)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
.modal.show{display:flex}
.dialog{padding:24px;max-height:92vh;display:flex;flex-direction:column;text-align:center}
.waiterLangStep h2,.chatStep h2{margin:0 0 6px}
.waiterLangStep p{color:var(--muted)}
.chatStep.hidden,.waiterLangStep.hidden{display:none}
.orb{width:74px;height:74px;margin:12px auto;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 #b8893555;transition:.2s}
.orb.speaking{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 16px #b8893500}}
#status{color:var(--muted);font-size:13px;margin:4px 0 10px;min-height:22px}
.transcript{overflow-y:auto;flex:1;min-height:120px;max-height:38vh;padding:6px 2px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;text-align:start}
.bubble.assistant{background:#f1e6d2;align-self:flex-start}
.bubble.user{background:#21170f;color:#fff;align-self:flex-end}
.askRow{display:flex;gap:8px;margin-top:12px}
.askRow input{flex:1;border:1px solid #d8c7ae;border-radius:999px;padding:11px 16px;font-size:16px;min-width:0}
.askRow input:focus{outline:2px solid var(--gold)}
.micBtn{border:0;background:var(--gold);color:white;border-radius:50%;width:48px;height:48px;font-size:19px;cursor:pointer;flex-shrink:0}
.micBtn.recording{background:var(--danger);animation:pulse .7s infinite}
.micBtn:disabled{opacity:.5;cursor:not-allowed}
.end{border:0;background:var(--danger);color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;margin-top:12px;cursor:pointer}
.permissionHelp{display:none;background:#fff5f5;border:1px solid #fed7d7;color:#742a2a;padding:10px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:8px}
.permissionHelp.show{display:block}
.recordHint{font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  .topbar{padding-inline:16px}.brandLogo{width:42px;height:42px}.brand{font-size:21px}.sub{font-size:11px}
  nav{padding-inline:16px}.hero{border-radius:22px;padding:28px 22px;min-height:180px}.hero h1{font-size:34px}
  main{padding-inline:14px}.grid{grid-template-columns:1fr;gap:14px}.card{border-radius:20px}
  .foodImageWrap{aspect-ratio:16/10}.dialog{padding:18px}.section-title{font-size:25px}
}
</style>
</head>

<main>

        <button class="languageChoice" data-waiter-lang="fr">🇫🇷 Français</button>
        <button class="languageChoice" data-waiter-lang="en">🇬🇧 English</button>
      </div>
      <button class="end" id="cancelWaiter">إغلاق</button>
    </div>

    <div class="chatStep hidden" id="chatStep">
      <h2 id="modalDish"></h2>
      <div class="orb" id="orb"></div>
      <p id="status"></p>
      <div class="transcript" id="transcript"></div>
      <div class="askRow">
        <input id="askInput" type="text" autocomplete="off">
        <button class="micBtn" id="micBtn" aria-label="Microphone">🎤</button>
      </div>
      <div class="recordHint" id="recordHint"></div>
      <button id="testAudioBtn" type="button" style="margin:8px auto 0;border:1px solid #d8c7ae;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer">🔊 اختبار الصوت</button>
      <div id="diagBox" style="display:none;margin-top:8px;padding:10px;border:1px solid #d8c7ae;border-radius:12px;font-size:12px;line-height:1.7;text-align:start"></div>
      <div class="permissionHelp" id="permissionHelp"></div>
      <button class="end" id="end">إنهاء</button>
    </div>
  </div>
</div>

function translateMenuText(value,lang){
 if(lang==='fr'||!lang) return value;
 const exact=EXACT_MENU_I18N[value];
 if(exact && exact[lang]) return exact[lang];

 // Fallback only for future menu items that are added later.
 const pack=MENU_I18N[lang];
 if(!pack) return value;
 let out=value;
 (pack.words||[]).forEach(([a,b])=>{out=out.split(a).join(b)});
 return out;
}
function menuCategory(value,lang){
 return (MENU_I18N[lang]&&MENU_I18N[lang].categories[value])||value;
}
function refreshMenuLanguage(){
 document.querySelectorAll('#nav button').forEach((b,i)=>{
   if(menu[i]) b.textContent=menuCategory(menu[i].cat,siteLanguage);
 });

 document.querySelectorAll('#menu section').forEach((sec,i)=>{
   if(!menu[i]) return;

   const localizedCategory=menuCategory(menu[i].cat,siteLanguage);
   const h=sec.querySelector('.section-title');
   if(h){
     const titleSpan=h.querySelector('span') || h;
     titleSpan.textContent=localizedCategory;
   }

   sec.querySelectorAll('.card').forEach((card,j)=>{
     const d=menu[i].items[j];
     if(!d) return;

     const localizedName=translateMenuText(d[0],siteLanguage);
     const localizedDesc=translateMenuText(d[1],siteLanguage);

     const h3=card.querySelector('h3');
     const desc=card.querySelector('.desc');

     if(h3) h3.textContent=localizedName;
     if(desc) desc.textContent=localizedDesc;

     // Search now understands Arabic, English and French.
     card.dataset.search=(
       localizedCategory+' '+localizedName+' '+localizedDesc+' '+
       menu[i].cat+' '+d[0]+' '+d[1]
     ).toLowerCase();

     const sig=card.querySelector('.signature');
     if(sig){
       sig.textContent=
         siteLanguage==='ar'?'اختيار فيكتور':
         siteLanguage==='en'?'Victor Signature':
         'Signature Victor';
     }
   });
 });
}

function openWaiter(d){
 currentDish=d; conversationHistory=[];
 waiterLanguage=siteLanguage||'ar'; permissionHelp.classList.remove('show');

 input.placeholder=t.placeholder; endBtn.textContent=t.end; document.querySelector('#recordHint').textContent=t.hint;
 transcript.innerHTML=''; permissionHelp.classList.remove('show');

function addBubble(role,text){

function compactMenu(){

function friendlyApiError(data,statusCode){
 const t=TEXT[waiterLanguage]||TEXT.en;
 const code=(data&&data.code)||'';
 const msg=(data&&(data.message||data.error))||'';
 if(statusCode===401 || code==='invalid_api_key') return t.apiKeyError;
 if(statusCode===403 || code==='model_not_found' || code==='permission_denied') return t.permissionError;
 if(statusCode===429 || code==='insufficient_quota' || /quota|billing|credit/i.test(msg)) return t.quotaError;
 return msg || t.serverError;
}
function showDiagnostic(message,ok=false){
 const box=document.querySelector('#diagBox');
 if(!box)return;
 box.style.display='block';
 box.style.background=ok?'#f0fff4':'#fff5f5';
 box.style.borderColor=ok?'#9ae6b4':'#fed7d7';
 box.style.color=ok?'#22543d':'#742a2a';
 box.textContent=message;
}
async function runDiagnostics(){
 try{
   const r=await fetch('/api/diagnostics',{cache:'no-store'});
   const data=await r.json().catch(()=>({}));
   if(r.ok && data.ok){
     showDiagnostic(
       waiterLanguage==='ar'?'✅ اتصال AI جاهز':
       waiterLanguage==='fr'?'✅ Connexion AI prête':'✅ AI connection ready',
       true
     );
     return true;
   }
   showDiagnostic(friendlyApiError(data,r.status),false);
   return false;
 }catch(e){
   showDiagnostic((TEXT[waiterLanguage]||TEXT.en).serverError,false);
   return false;
 }
}

async function fetchJSON(url,options,timeout=45000){
 const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeout);
 try{
   const r=await fetch(url,{...options,signal:controller.signal});
   const data=await r.json().catch(()=>({}));
   if(!r.ok){
     const err=new Error(friendlyApiError(data,r.status));
     err.status=r.status; err.data=data; throw err;
   }
   return data;
 }finally{clearTimeout(timer)}
}
async function askAI(question){
 return fetchJSON('/api/ai',{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({question,dish:{name:translateMenuText(currentDish[0],waiterLanguage),description:translateMenuText(currentDish[1],waiterLanguage),price:currentDish[2]},menu:compactMenu(),history:conversationHistory.slice(-10),language:waiterLanguage})
 });
}


function stopAISpeech(){
  try{
    if(typeof speechSource!=='undefined' && speechSource){
      try{speechSource.stop();}catch(e){}
      speechSource=null;
    }
    if(currentAudio){
      try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}
      currentAudio=null;
    }
    orb.classList.remove('speaking');
  }catch(e){
    console.warn('Could not stop AI speech',e);
  }
}

async function unlockSpeechAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    if(!speechAudioContext) speechAudioContext=new AC();
    if(speechAudioContext.state==='suspended') await speechAudioContext.resume();

    // Start a silent buffer while we are still inside a real user gesture.
    const b=speechAudioContext.createBuffer(1,1,22050);
    const s=speechAudioContext.createBufferSource();
    s.buffer=b;
    s.connect(speechAudioContext.destination);
    s.start(0);
    speechUnlocked=true;
    return true;
  }catch(e){
    console.warn("Audio unlock failed:",e);
    return false;
  }
}

async function speakAI(text){
  try{
    const clean=String(text||'').trim();
    if(!clean) return;

    if(currentAudio){
      try{currentAudio.pause();}catch(e){}
      currentAudio=null;
    }
    if(typeof speechSource !== 'undefined' && speechSource){
      try{speechSource.stop();}catch(e){}
      speechSource=null;
    }

    const r=await fetch('/api/tts',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:clean,language:waiterLanguage})
    });

    if(!r.ok){
      const data=await r.json().catch(()=>({}));
      throw new Error(data.message||data.error||('TTS HTTP '+r.status));
    }

    const blob=await r.blob();
    if(!blob.size) throw new Error('TTS returned an empty audio file');

    // Safari/iOS: decode and play through the AudioContext unlocked by the user's tap.
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        if(!speechAudioContext) speechAudioContext=new AC();
        if(speechAudioContext.state==='suspended') await speechAudioContext.resume();

        const bytes=await blob.arrayBuffer();
        const decoded=await speechAudioContext.decodeAudioData(bytes.slice(0));
        speechSource=speechAudioContext.createBufferSource();
        speechSource.buffer=decoded;
        speechSource.connect(speechAudioContext.destination);
        orb.classList.add('speaking');
        speechSource.onended=()=>{
          orb.classList.remove('speaking');
          speechSource=null;
        };
        speechSource.start(0);
        return;
      }
    }catch(webAudioError){
      console.warn("WebAudio playback failed:",webAudioError);
    }

    // Fallback for Chrome/Firefox/other browsers.
    const url=URL.createObjectURL(blob);
    const audio=new Audio();
    currentAudio=audio;
    audio.preload='auto';
    audio.playsInline=true;
    audio.src=url;
    orb.classList.add('speaking');

    audio.onended=()=>{
      orb.classList.remove('speaking');
      URL.revokeObjectURL(url);
      if(currentAudio===audio) currentAudio=null;
    };
    audio.onerror=()=>{
      orb.classList.remove('speaking');
      URL.revokeObjectURL(url);
    };

    await audio.play();
  }catch(e){
    console.error("TTS playback error:",e);
    orb.classList.remove('speaking');

    const msg=
      waiterLanguage==='ar'
        ? 'الرد النصي يعمل، لكن تشغيل الصوت فشل: '+(e.message||'خطأ غير معروف')
        : waiterLanguage==='fr'
        ? "Le texte fonctionne, mais l'audio a échoué : "+(e.message||'Erreur inconnue')
        : 'Text works, but audio playback failed: '+(e.message||'Unknown error');

    showDiagnostic(msg,false);
    status.textContent=msg;
  }
}
async function submitQuestion(q){
 q=(q||'').trim(); if(!q)return;
 addBubble('user',q); conversationHistory.push({role:'user',content:q});
 input.value=''; input.disabled=true; micBtn.disabled=true; status.textContent=TEXT[waiterLanguage].thinking;
 try{
  const data=await askAI(q);
  const answer=String((data&&data.answer)||'').trim();
  if(!answer){
    throw new Error(
      waiterLanguage==='ar'?'لم تصل إجابة من النادلة. حاول مرة أخرى.':
      waiterLanguage==='fr'?"Aucune réponse reçue. Réessayez.":
      'No answer was received. Please try again.'
    );
  }
  addBubble('assistant',answer); conversationHistory.push({role:'assistant',content:answer});
  status.textContent=TEXT[waiterLanguage].ready; await speakAI(answer);
 }catch(e){
  console.error(e);
  const message=e.message||TEXT[waiterLanguage].aiError;
  status.textContent=message;
  showDiagnostic(message,false);
 }
 finally{input.disabled=false;micBtn.disabled=false;}
}
input.addEventListener('keydown',async e=>{
 if(e.key==='Enter'){
   stopAISpeech();
   await unlockSpeechAudio();
   submitQuestion(input.value);
 }
});

function bestMime(){
 if(!window.MediaRecorder)return '';
 const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];
 return types.find(t=>MediaRecorder.isTypeSupported?.(t))||'';
}
function stopVAD(){
 if(vadFrame){cancelAnimationFrame(vadFrame);vadFrame=null;}
 if(audioContext){audioContext.close().catch(()=>{});audioContext=null;}
 analyser=null; speechStarted=false; speechStartAt=0; silenceStartAt=0;
}
function startVAD(){
 if(!stream || !(window.AudioContext||window.webkitAudioContext)) return;
 const AC=window.AudioContext||window.webkitAudioContext;
 audioContext=new AC();
 const source=audioContext.createMediaStreamSource(stream);
 analyser=audioContext.createAnalyser();
 analyser.fftSize=1024; analyser.smoothingTimeConstant=.25; source.connect(analyser);
 const data=new Uint8Array(analyser.fftSize);
 const tick=()=>{
  if(!recording||!analyser)return;
  analyser.getByteTimeDomainData(data);
  let sum=0;
  for(let i=0;i<data.length;i++){const x=(data[i]-128)/128;sum+=x*x;}
  const rms=Math.sqrt(sum/data.length), now=performance.now();
  if(rms>SPEECH_THRESHOLD){
   if(!speechStarted){speechStarted=true;speechStartAt=now;}
   silenceStartAt=0;
  }else if(speechStarted && now-speechStartAt>=MIN_SPEECH_MS){
   if(!silenceStartAt)silenceStartAt=now;
   if(now-silenceStartAt>=SILENCE_MS){stopRecording();return;}
  }
  vadFrame=requestAnimationFrame(tick);
 };
 vadFrame=requestAnimationFrame(tick);
}
async function startRecording(){
 permissionHelp.classList.remove('show');
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
  status.textContent=TEXT[waiterLanguage].micError; permissionHelp.textContent=TEXT[waiterLanguage].permission; permissionHelp.classList.add('show'); return;
 }
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  chunks=[]; const mime=bestMime(); recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  recorder.onstop=sendVoice;
  recorder.start(250); recording=true; micBtn.classList.add('recording'); micBtn.textContent='⏹'; status.textContent=TEXT[waiterLanguage].recording;
  startVAD();
 }catch(e){
  console.error(e); status.textContent=TEXT[waiterLanguage].micError; permissionHelp.textContent=TEXT[waiterLanguage].permission; permissionHelp.classList.add('show');
 }
}
function stopRecording(){
 if(!recording)return;
 recording=false; stopVAD(); micBtn.classList.remove('recording'); micBtn.textContent='🎤';
 if(recorder&&recorder.state!=='inactive')recorder.stop();
}
async function sendVoice(){
 try{
  status.textContent=TEXT[waiterLanguage].transcribing; micBtn.disabled=true;
  const mime=recorder.mimeType||'audio/webm'; const ext=mime.includes('mp4')?'m4a':'webm';
  const blob=new Blob(chunks,{type:mime});
  if(blob.size<800) throw new Error('Recording too short');
  const form=new FormData(); form.append('audio',blob,'voice.'+ext); form.append('language',waiterLanguage);
  const r=await fetch('/api/transcribe',{method:'POST',body:form});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.text){
   const err=new Error(friendlyApiError(data,r.status));
   err.status=r.status; throw err;
  }
  await submitQuestion(data.text);
 }catch(e){
  console.error(e); status.textContent=e.message||TEXT[waiterLanguage].serverError; showDiagnostic(status.textContent,false);
 }finally{
  micBtn.disabled=false; chunks=[];
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 }
}
micBtn.onclick=async()=>{
 stopAISpeech();
 await unlockSpeechAudio();
 recording?stopRecording():startRecording();
};

function closeWaiter(){
 stopVAD();
 if(recording) stopRecording();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 if(currentAudio){currentAudio.pause();currentAudio=null;}
 modal.classList.remove('show'); currentDish=null; conversationHistory=[];
}
endBtn.onclick=closeWaiter;
