<style>
:root{--ink:#21170f;--gold:#b88935;--cream:#f7f1e7;--card:#fffdf9;--muted:#776b60}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Cairo,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(33,23,15,.96);color:#fff;padding:18px 5%;box-shadow:0 4px 18px #0002}
.brand{font-family:"Playfair Display",serif;font-size:28px}.sub{opacity:.75;font-size:13px}
nav{display:flex;gap:8px;overflow:auto;padding-top:12px}nav button{white-space:nowrap;border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:999px;padding:8px 12px}
main{max-width:1200px;margin:auto;padding:28px 5%}.hero{text-align:center;padding:25px 0 35px}.hero h1{font-family:"Playfair Display",serif;font-size:42px;margin:0 0 8px}.hero p{color:var(--muted)}
section{margin:30px 0}.section-title{font-family:"Playfair Display",serif;font-size:29px;border-bottom:1px solid #d8c7ae;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid #eadfce;border-radius:18px;padding:18px;box-shadow:0 8px 25px #4b321011;position:relative}
.card h3{margin:0 0 8px;font-size:20px}.desc{color:var(--muted);font-size:14px;line-height:1.8;min-height:25px}.price{position:absolute;left:16px;top:16px;background:var(--gold);color:#fff;border-radius:999px;padding:7px 11px;font-weight:800}.signature{display:inline-block;background:#21170f;color:#fff;border-radius:999px;padding:4px 8px;font-size:11px;margin-bottom:8px}
.voice{margin-top:14px;width:100%;border:0;border-radius:12px;padding:11px;background:#21170f;color:#fff;font-family:inherit;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.show{display:flex}.dialog{background:#fffdf9;border-radius:24px;padding:28px;max-width:460px;width:100%;text-align:center;max-height:88vh;display:flex;flex-direction:column}.orb{width:70px;height:70px;margin:14px auto;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite;flex-shrink:0}.orb.speaking{animation:pulse .5s infinite}.end{border:0;background:#9b2c2c;color:white;padding:12px 24px;border-radius:999px;font-family:inherit;font-weight:700;margin-top:14px;cursor:pointer;flex-shrink:0}@keyframes pulse{50%{transform:scale(1.12);opacity:.65}}
#status{color:var(--muted);font-size:13px;margin:4px 0 10px}
.transcript{text-align:right;overflow-y:auto;flex:1;min-height:60px;max-height:38vh;padding:4px 2px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;text-align:left}
.bubble.assistant{background:#f1e6d2;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.user{background:#21170f;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.langRow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:0 0 10px}.langBtn{border:1px solid #d8c7ae;background:#fffdf9;color:var(--ink);border-radius:999px;padding:7px 11px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}.langBtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.askRow{display:flex;gap:8px;margin-top:12px;flex-shrink:0}
.askRow input{flex:1;border:1px solid #d8c7ae;border-radius:999px;padding:11px 16px;font-family:inherit;font-size:14px}
.askRow input:focus{outline:2px solid var(--gold)}
.askRow button{border:0;background:var(--gold);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
.askRow button.listening{background:#9b2c2c;animation:pulse .6s infinite}
@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>

const nav=document.querySelector('#nav'), root=document.querySelector('#menu');
menu.forEach((s,i)=>{
 const b=document.createElement('button'); b.textContent=s.cat; b.onclick=()=>document.getElementById('s'+i).scrollIntoView({behavior:'smooth'}); nav.appendChild(b);
 const sec=document.createElement('section'); sec.id='s'+i; sec.innerHTML=`<h2 class="section-title">${s.cat}</h2><div class="grid"></div>`;
 const grid=sec.querySelector('.grid');
 s.items.forEach(d=>{const c=document.createElement('article'); c.className='card'; c.innerHTML=`${d[3]?'<span class="signature">Signature Victor</span>':''}<h3>${d[0]}</h3><div class="desc">${d[1]}</div><div class="price">${d[2]}</div><button class="voice">🎙️ Demander à la serveuse</button>`; c.querySelector('.voice').onclick=()=>startVoice(d); grid.appendChild(c)});
 root.appendChild(sec);
});
/* ===== Serveuse virtuelle — OpenAI + audio compatible Safari/iPhone/Chrome ===== */
const modal=document.querySelector('#modal'), status=document.querySelector('#status'),
      title=document.querySelector('#modalDish'), orb=document.querySelector('#orb'),
      transcript=document.querySelector('#transcript'), input=document.querySelector('#askInput'),
      micBtn=document.querySelector('#micBtn'), endBtn=document.querySelector('#end'),
      langButtons=[...document.querySelectorAll('.langBtn')];

let currentDish=null;
let selectedLanguage='auto';
let lastDetectedLanguage='fr';
let conversationHistory=[];
let mediaRecorder=null;
let mediaStream=null;
let audioChunks=[];
let isRecording=false;
let currentAudio=null;

const uiText={
 ar:{placeholder:'اكتب سؤالك… مثال: هل الطبق حار؟',listen:'أنا أستمع… اضغط مرة أخرى لإرسال التسجيل 🎤',ready:'اسأل سؤالًا آخر بالكتابة أو الميكروفون 🎤',thinking:'النادلة تفكر… ✨',transcribing:'جارٍ فهم كلامك… 🎧',micUnavailable:'تعذر تشغيل الميكروفون. تأكد من السماح للموقع باستخدامه.',aiUnavailable:'تعذر الاتصال بالـAI. حاول مرة أخرى.',end:'إنهاء'},
 fr:{placeholder:"Tapez votre question… (ex: c'est épicé ?)",listen:"Je vous écoute… appuyez encore pour envoyer 🎤",ready:"Posez une autre question, à l'écrit ou au micro 🎤",thinking:'La serveuse réfléchit… ✨',transcribing:'Je comprends votre message… 🎧',micUnavailable:"Impossible d'utiliser le micro. Vérifiez l'autorisation du navigateur.",aiUnavailable:"Impossible de joindre l'AI. Réessayez.",end:'Terminer'},
 en:{placeholder:'Type your question… e.g. is it spicy?',listen:'I’m listening… tap again to send 🎤',ready:'Ask another question by text or microphone 🎤',thinking:'The waitress is thinking… ✨',transcribing:'Understanding your voice… 🎧',micUnavailable:'Unable to use the microphone. Check browser permission.',aiUnavailable:'Unable to reach the AI. Please try again.',end:'End'}
};

function detectLanguage(text){
 if(/[\u0600-\u06FF]/.test(text||'')) return 'ar';
 if(/[àâçéèêëîïôùûüÿœæ]/i.test(text||'') || /\b(bonjour|merci|prix|plat|avec|sans|pour|je|vous|est|une|des|du|de|le|la)\b/i.test(text||'')) return 'fr';
 return 'en';
}
function activeLanguage(text=''){
 if(selectedLanguage!=='auto') return selectedLanguage;
 if(text) lastDetectedLanguage=detectLanguage(text);
 return lastDetectedLanguage||'fr';
}
function refreshLanguageUI(){
 const lang=activeLanguage(), t=uiText[lang];
 input.placeholder=t.placeholder;
 endBtn.textContent=t.end;
 langButtons.forEach(b=>b.classList.toggle('active',b.dataset.lang===selectedLanguage));
 document.querySelector('.dialog').dir=lang==='ar'?'rtl':'ltr';
}
langButtons.forEach(b=>b.addEventListener('click',()=>{
 selectedLanguage=b.dataset.lang;
 if(selectedLanguage!=='auto') lastDetectedLanguage=selectedLanguage;
 refreshLanguageUI();
 status.textContent=uiText[activeLanguage()].ready;
}));

function addBubble(role,text){
 const b=document.createElement('div');
 b.className='bubble '+role;
 b.textContent=text;
 b.dir=detectLanguage(text)==='ar'?'rtl':'ltr';
 transcript.appendChild(b);
 transcript.scrollTop=transcript.scrollHeight;
}

function compactMenu(){
 return menu.map(section=>({
   category:section.cat,
   items:section.items.map(d=>({name:d[0],description:d[1],price:d[2]}))
 }));
}

async function askAI(question){
 const payload={
   question,
   dish:currentDish?{name:currentDish[0],description:currentDish[1],price:currentDish[2]}:null,
   menu:compactMenu(),
   history:conversationHistory.slice(-10),
   language:selectedLanguage,
   detectedLanguage:activeLanguage(question)
 };
 const res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const data=await res.json().catch(()=>({}));
 if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
 if(!data.answer) throw new Error('Empty AI response');
 return data.answer;
}

async function speakAI(text){
 try{
   if(currentAudio){currentAudio.pause();currentAudio=null;}
   const lang=activeLanguage(text);
   const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:lang})});
   if(!res.ok) throw new Error('TTS failed');
   const blob=await res.blob();
   const url=URL.createObjectURL(blob);
   const audio=new Audio(url);
   currentAudio=audio;
   orb.classList.add('speaking');
   audio.onended=()=>{orb.classList.remove('speaking');URL.revokeObjectURL(url);if(currentAudio===audio)currentAudio=null;};
   audio.onerror=()=>{orb.classList.remove('speaking');URL.revokeObjectURL(url);};
   await audio.play();
 }catch(err){
   console.warn('TTS:',err);
   orb.classList.remove('speaking');
 }
}

async function ask(){
 const q=(input.value||'').trim();
 if(!q||!currentDish) return;
 addBubble('user',q); input.value='';
 if(selectedLanguage==='auto') lastDetectedLanguage=detectLanguage(q);
 refreshLanguageUI();
 conversationHistory.push({role:'user',content:q});
 status.textContent=uiText[activeLanguage(q)].thinking;
 input.disabled=true; micBtn.disabled=true;
 try{
   const answer=await askAI(q);
   addBubble('assistant',answer);
   conversationHistory.push({role:'assistant',content:answer});
   status.textContent=uiText[activeLanguage(answer)].ready;
   await speakAI(answer);
 }catch(err){
   console.error(err);
   status.textContent=uiText[activeLanguage()].aiUnavailable;
 }finally{
   input.disabled=false; micBtn.disabled=false; input.focus();
 }
}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!input.disabled)ask();});

function preferredMimeType(){
 const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
 return types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
}
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
   status.textContent=uiText[activeLanguage()].micUnavailable; return;
 }
 try{
   mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
   const mimeType=preferredMimeType();
   mediaRecorder=new MediaRecorder(mediaStream,mimeType?{mimeType}:undefined);
   audioChunks=[];
   mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data);};
   mediaRecorder.onstop=sendRecording;
   mediaRecorder.start();
   isRecording=true;
   micBtn.classList.add('listening'); micBtn.textContent='⏹';
   status.textContent=uiText[activeLanguage()].listen;
 }catch(err){
   console.error(err);
   status.textContent=uiText[activeLanguage()].micUnavailable;
 }
}
function stopRecording(){
 if(!isRecording||!mediaRecorder)return;
 isRecording=false;
 micBtn.classList.remove('listening'); micBtn.textContent='🎤';
 mediaRecorder.stop();
}
async function sendRecording(){
 try{
   status.textContent=uiText[activeLanguage()].transcribing;
   micBtn.disabled=true;
   const type=mediaRecorder?.mimeType||'audio/webm';
   const blob=new Blob(audioChunks,{type});
   const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
   const form=new FormData();
   form.append('audio',blob,`question.${ext}`);
   form.append('language',selectedLanguage);
   const res=await fetch('/api/transcribe',{method:'POST',body:form});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.text)throw new Error(data.error||'Transcription failed');
   input.value=data.text;
   if(selectedLanguage==='auto')lastDetectedLanguage=detectLanguage(data.text);
   refreshLanguageUI();
   await ask();
 }catch(err){
   console.error(err);
   status.textContent=uiText[activeLanguage()].micUnavailable;
 }finally{
   micBtn.disabled=false;
   if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
   mediaRecorder=null; audioChunks=[];
 }
}
micBtn.onclick=()=>isRecording?stopRecording():startRecording();

function startVoice(d){
 currentDish=d; conversationHistory=[]; title.textContent=d[0]; modal.classList.add('show');
 transcript.innerHTML=''; input.value=''; refreshLanguageUI();
 const lang=activeLanguage();
 const intros={
   ar:`مرحبًا! أنا نادلتك الافتراضية. أنت تشاهد ${d[0]}. الوصف: ${d[1]}. اسألني عن المكونات أو السعر أو المقارنة أو الترشيحات.`,
   fr:`Bonjour ! Je suis votre serveuse virtuelle. Vous regardez ${d[0]}. ${d[1]}. Posez-moi une question sur les ingrédients, le prix, une comparaison ou une recommandation.`,
   en:`Hello! I’m your virtual waitress. You’re viewing ${d[0]}. ${d[1]}. Ask me about ingredients, price, comparisons, or recommendations.`
 };
 const intro=intros[lang];
 addBubble('assistant',intro); conversationHistory.push({role:'assistant',content:intro});
 status.textContent=uiText[lang].ready;
 speakAI(intro);
}
refreshLanguageUI();

endBtn.onclick=()=>{
 if(isRecording)stopRecording();
 if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
 if(currentAudio){currentAudio.pause();currentAudio=null;}
 modal.classList.remove('show'); currentDish=null;
};

</script></body></html>
