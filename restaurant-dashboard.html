<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المطعم — Café Victor Hugo</title>
<style>
:root{--bg:#0b0d0e;--panel:#111416;--card:#171b1d;--line:#2a2f32;--text:#f4f1eb;--muted:#a5aaa7;--gold:#d9a85f;--red:#ff655c;--green:#6dd39e;--blue:#72b7ff;--purple:#c39cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial}.wrap{max-width:1280px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:5px 0;color:var(--muted)}button,input,textarea{font:inherit}.logout,.btn,.tab{border:1px solid var(--line);background:#191d1f;color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer}.btn.primary{background:var(--gold);color:#17110a;border-color:var(--gold);font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{font-size:28px;color:var(--gold);display:block}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab.active{background:var(--gold);color:#17110a;border-color:var(--gold);font-weight:800}.search{min-width:260px;flex:1;max-width:420px;background:#101315;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;min-width:0}.card.new{border-color:#8d682f;box-shadow:inset 0 0 0 1px #8d682f55}.code{color:var(--gold);font-weight:800}.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:#24292c}.badge.new{color:#ffd36c}.badge.confirmed,.badge.preparing{color:var(--blue)}.badge.arrived,.badge.ready{color:var(--purple)}.badge.completed,.badge.served{color:var(--green)}.badge.cancelled{color:#ff8178}.name{font-size:19px;font-weight:800;margin:12px 0}.tableNo{font-size:25px;font-weight:900;margin:12px 0;color:#fff}.meta{color:var(--muted);line-height:1.8;font-size:14px}.note{background:#221c16;border:1px solid #594329;border-radius:10px;padding:9px;margin-top:10px}.pre{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:flex;justify-content:space-between}.mod{color:var(--red);font-weight:900}.late{color:#ffb15f;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 12px;background:var(--panel);border:1px dashed var(--line);border-radius:16px}.drawer{position:fixed;inset:0;background:#0009;display:none;justify-content:flex-start;z-index:20}.drawer.open{display:flex}.sheet{width:min(570px,100%);background:#101315;border-left:1px solid var(--line);padding:20px;overflow:auto}.close{float:left;background:none;border:0;color:var(--text);font-size:30px;cursor:pointer}.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.section h3{color:var(--gold);margin:0 0 10px}.kv{display:grid;grid-template-columns:135px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #24282a}.kv:last-child{border:0}.kv span{color:var(--muted)}.item{padding:10px 0;border-bottom:1px solid #292d30}.item:last-child{border:0}.total{color:var(--gold);font-size:20px;font-weight:800}.staffnote{width:100%;min-height:80px;background:#0c0f10;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.state{border:1px solid var(--line);background:#1a1e20;color:var(--text);padding:11px 6px;border-radius:10px;cursor:pointer}.login{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.login input{width:100%;padding:13px;background:#0b0d0e;border:1px solid var(--line);color:white;border-radius:10px;margin:14px 0}.login button{width:100%;background:var(--gold);color:#16110a;border:0;border-radius:10px;padding:12px;font-weight:800}.error{color:#ff8178}.hidden{display:none!important}.qrPanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.qrControls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.qrControls label{color:var(--muted);font-size:13px}.qrControls input{display:block;margin-top:6px;width:120px;background:#0d1011;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}.qrGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.qrCard{background:white;color:#111;border-radius:14px;padding:12px;text-align:center}.qrCard img{width:100%;max-width:190px;aspect-ratio:1;object-fit:contain}.qrCard b{display:block;font-size:18px;margin-top:6px}.qrCard small{display:block;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.printOnly{display:none}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.qrGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.states{grid-template-columns:repeat(2,1fr)}.search{min-width:100%}.qrGrid{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.top,.stats,.toolbar,.qrControls{display:none!important}.qrPanel{border:0}.qrGrid{grid-template-columns:repeat(3,1fr)}.qrCard{break-inside:avoid;border:1px solid #ddd}}
</style></head><body>
<div id="login" class="login hidden"><h2>دخول لوحة المطعم</h2><p style="color:var(--muted)">Café Victor Hugo — الحجوزات وطلبات الطاولات</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button>دخول</button><p id="loginError" class="error"></p></form></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand"><h1>Café Victor Hugo</h1><p>لوحة الطلبات والحجوزات</p></div><button class="logout" id="logout">تسجيل الخروج</button></div>
<div class="stats"><div class="stat"><b id="sTableNew">0</b><span>طلبات طاولات جديدة</span></div><div class="stat"><b id="sToday">0</b><span>حجوزات اليوم</span></div><div class="stat"><b id="sGuests">0</b><span>ضيوف اليوم</span></div><div class="stat"><b id="sSales">0 ر.س</b><span>طلبات نشطة</span></div></div>
<div class="toolbar"><div class="tabs"><button class="tab active" data-view="tables">🧾 الطلبات</button><button class="tab" data-view="today">📅 حجوزات اليوم</button><button class="tab" data-view="upcoming">القادمة</button><button class="tab" data-view="archive">الأرشيف</button><button class="tab" data-view="qr">QR الطاولات</button></div><input id="search" class="search" placeholder="بحث بالطاولة أو الاسم أو رقم الطلب/الحجز أو الجوال"></div>
<div id="grid" class="grid"></div><div id="qrPanel" class="qrPanel hidden"><div class="qrControls"><div><label>عدد الطاولات<input id="tableCount" type="number" min="1" max="100" value="20"></label></div><button id="makeQr" class="btn primary">إنشاء QR</button><button id="printQr" class="btn">طباعة</button></div><p style="color:var(--muted)">كل QR يفتح نفس المنيو ويضيف رقم الطاولة تلقائيًا للطلب.</p><div id="qrGrid" class="qrGrid"></div></div></div>
<div id="drawer" class="drawer"><div class="sheet"><button id="close" class="close">×</button><h2 id="dTitle">التفاصيل</h2><div id="detail"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let reservations=[],orders=[],view='tables',selected=null,lastOrderIds=new Set(),firstLoad=true;
const rLabels={new:'جديد',confirmed:'تم التأكيد',arrived:'حضر العميل',completed:'مكتمل',cancelled:'ملغي'};const oLabels={new:'جديد',preparing:'قيد التحضير',ready:'جاهز',served:'تم التقديم',cancelled:'ملغي'};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401)throw Object.assign(new Error('AUTH'),{auth:true});const j=await r.json();if(!r.ok)throw new Error(j.message||'حدث خطأ');return j}function money(n){return(Number(n)||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dt(v){return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}).format(new Date(v))}function time(v){return new Intl.DateTimeFormat('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}).format(new Date(v))}function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},180)}catch{}}
async function load(){try{const [r,o]=await Promise.all([api('/api/restaurant/reservations'),api('/api/restaurant/table-orders')]);reservations=r.reservations||[];orders=o.orders||[];$('#login').classList.add('hidden');$('#app').classList.remove('hidden');const ids=new Set(orders.filter(x=>x.status==='new').map(x=>x.id));if(!firstLoad&&[...ids].some(x=>!lastOrderIds.has(x)))beep();lastOrderIds=ids;firstLoad=false;render()}catch(e){if(e.auth){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}}}
function render(){
  // كل أرقام الشاشة اليومية تعتمد فقط على يوم الرياض الحالي.
  // عند منتصف الليل تختفي بيانات اليوم السابق من العدادات والشاشة النشطة تلقائياً،
  // لكن تبقى محفوظة في قاعدة البيانات/الأرشيف، والحجوزات المستقبلية تبقى في "القادمة".
  const today=reservations.filter(x=>x.bucket==='today'&&!['completed','cancelled'].includes(x.status));
  const todayOrders=orders.filter(x=>x.bucket==='today');
  const activeOrders=todayOrders.filter(x=>!['served','cancelled'].includes(x.status));
  $('#sTableNew').textContent=todayOrders.filter(x=>x.status==='new').length;
  $('#sToday').textContent=today.length;
  $('#sGuests').textContent=today.reduce((a,x)=>a+Number(x.party_size||0),0);
  $('#sSales').textContent=money(activeOrders.reduce((a,x)=>a+Number(x.order_total_sar||0),0)+today.reduce((a,x)=>a+Number(x.order_total_sar||0),0));
  $('#grid').classList.toggle('hidden',view==='qr');$('#qrPanel').classList.toggle('hidden',view!=='qr');if(view==='qr')return;
  const q=$('#search').value.trim().toLowerCase();let rows=[];
  if(view==='tables')rows=activeOrders.map(x=>({...x,_type:'order'}));
  else rows=reservations.filter(x=>x.bucket===view&&(view!=='today'||!['completed','cancelled'].includes(x.status))).map(x=>({...x,_type:'reservation'}));
  if(q)rows=rows.filter(x=>[x.table_number,x.order_code,x.confirmation_code,x.customer_name,x.phone].some(v=>String(v||'').toLowerCase().includes(q)));
  $('#grid').innerHTML=rows.length?rows.map(x=>x._type==='order'?orderCard(x):reservationCard(x)).join(''):'<div class="empty">لا توجد عناصر في هذا القسم.</div>';
  $$('.card').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.type,Number(c.dataset.id))))
}
function orderCard(x){const external=x.order_mode==='external'||x.table_number==='OUTSIDE',dinein=x.order_mode==='dinein'||x.table_number==='DINEIN';const modeLabel=external?'🌐 استلام خارجي':dinein?'🍽️ أكل داخل المطعم':'🪑 طاولة '+esc(x.table_number);const preview=(x.order_items||[]).slice(0,4).map(i=>`<div class="item" style="padding:5px 0"><b>${Number(i.quantity)||1} × ${esc(i.name)}</b>${i.specialRequest?` <span class="mod">(${esc(i.specialRequest)})</span>`:''}</div>`).join('');return`<article class="card ${x.status==='new'?'new':''}" data-type="order" data-id="${x.id}"><div class="row"><span class="code">طلب #${esc(x.order_code)}</span><span class="badge ${esc(x.status)}">${oLabels[x.status]||esc(x.status)}</span></div><div class="tableNo">${modeLabel}</div>${(external||dinein)&&x.customer_name?`<div class="meta"><b>${esc(x.customer_name)}</b>${x.phone?' — '+esc(x.phone):''}</div>`:''}<div class="meta"><b style="color:var(--text)">🕐 تم الطلب الساعة ${time(x.created_at)}</b></div>${preview?`<div style="margin-top:8px">${preview}</div>`:''}${x.notes?`<div class="note">📝 ${esc(x.notes)}</div>`:''}<div class="pre"><span>الإجمالي</span><strong>${money(x.order_total_sar)}</strong></div></article>`}
function reservationCard(x){const has=(x.order_items||[]).length>0,late=x.is_late?'<span class="late">⚠️ متأخر</span>':'';return`<article class="card ${x.status==='new'?'new':''}" data-type="reservation" data-id="${x.id}"><div class="row"><span class="code">حجز #${esc(x.confirmation_code)}</span><span class="badge ${esc(x.status)}">${rLabels[x.status]||esc(x.status)}</span></div><div class="name">${esc(x.customer_name)}</div><div class="row"><div class="meta">🕐 موعد الحجز ${time(x.reservation_at)}<br><b style="color:var(--text)">📝 تم إنشاء الحجز الساعة ${time(x.created_at)}</b><br>👥 ${x.party_size} أشخاص<br>📞 <bdi>${esc(x.phone)}</bdi></div>${late}</div>${x.notes?`<div class="note">📝 ${esc(x.notes)}</div>`:''}<div class="pre"><span>${has?'🛒 طلب مسبق':'لا يوجد طلب مسبق'}</span><strong>${money(x.order_total_sar)}</strong></div></article>`}
function itemsHtml(items){return(items||[]).length?(items||[]).map(i=>`<div class="item"><b>${Number(i.quantity)||1} × ${esc(i.name)}</b>${i.specialRequest?` <span class="mod">(${esc(i.specialRequest)})</span>`:''}<div style="color:var(--muted);margin-top:4px">${i.unitPriceSar!=null?money(Number(i.unitPriceSar)*(Number(i.quantity)||1)):''}</div></div>`).join(''):'<span style="color:var(--muted)">لا توجد أصناف</span>'}
function openDetail(type,id){selected=type==='order'?orders.find(x=>x.id===id):reservations.find(x=>x.id===id);if(!selected)return;selected._type=type;if(type==='order'){const external=selected.order_mode==='external'||selected.table_number==='OUTSIDE',dinein=selected.order_mode==='dinein'||selected.table_number==='DINEIN';$('#dTitle').textContent=external?`استلام خارجي — #${selected.order_code}`:dinein?`أكل داخل المطعم — #${selected.order_code}`:`طلب طاولة ${selected.table_number} — #${selected.order_code}`;const who=(external||dinein)?`<div class="kv"><span>الاسم</span><b>${esc(selected.customer_name||'')}</b></div>${selected.phone?`<div class="kv"><span>الجوال</span><bdi>${esc(selected.phone||'')}</bdi></div>`:''}`:`<div class="kv"><span>رقم الطاولة</span><b>${esc(selected.table_number)}</b></div>`;$('#detail').innerHTML=`<div class="section"><h3>${external?'بيانات الاستلام الخارجي':dinein?'بيانات الأكل داخل المطعم':'الطاولة'}</h3>${who}<div class="kv"><span>نوع الطلب</span><b>${external?'استلام خارجي':dinein?'أكل/شرب داخل المطعم':'طلب طاولة'}</b></div><div class="kv"><span>تم الطلب الساعة</span><b>${time(selected.created_at)}</b></div><div class="kv"><span>تاريخ الطلب</span><b>${dt(selected.created_at)}</b></div></div><div class="section"><h3>تفاصيل الطلب والتعديلات</h3>${itemsHtml(selected.order_items)}<div style="color:var(--muted);font-size:12px;margin-top:8px">أي إضافة أو حذف خاص بالصنف يظهر بالأحمر بين قوسين بجانب الصنف.</div><div class="row" style="margin-top:12px"><b>الإجمالي</b><span class="total">${money(selected.order_total_sar)}</span></div></div><div class="section"><h3>ملاحظات العميل</h3>${selected.notes?esc(selected.notes):'<span style="color:var(--muted)">لا توجد ملاحظات عامة</span>'}</div><div class="section"><h3>ملاحظات المطعم</h3><textarea id="staffNote" class="staffnote">${esc(selected.staff_notes||'')}</textarea><button id="saveNote" class="btn" style="margin-top:8px">حفظ الملاحظة</button></div><div class="section"><h3>حالة الطلب</h3><div class="states">${['new','preparing','ready','served','cancelled'].map(s=>`<button class="state" data-s="${s}">${oLabels[s]}</button>`).join('')}</div></div>`}else{$('#dTitle').textContent=`تفاصيل الحجز #${selected.confirmation_code}`;$('#detail').innerHTML=`<div class="section"><h3>بيانات العميل</h3><div class="kv"><span>الاسم</span><b>${esc(selected.customer_name)}</b></div><div class="kv"><span>الجوال</span><bdi>${esc(selected.phone)}</bdi></div><div class="kv"><span>عدد الأشخاص</span><b>${selected.party_size}</b></div></div><div class="section"><h3>موعد الحجز</h3><div class="kv"><span>التاريخ والوقت</span><b>${dt(selected.reservation_at)}</b></div><div class="kv"><span>تم إنشاء الحجز الساعة</span><b>${time(selected.created_at)}</b></div><div class="kv"><span>تاريخ إنشاء الحجز</span><b>${dt(selected.created_at)}</b></div></div><div class="section"><h3>الطلب المسبق</h3>${itemsHtml(selected.order_items)}<div class="row" style="margin-top:12px"><b>الإجمالي</b><span class="total">${money(selected.order_total_sar)}</span></div></div><div class="section"><h3>ملاحظات العميل</h3>${selected.notes?esc(selected.notes):'<span style="color:var(--muted)">لا توجد ملاحظات عامة</span>'}</div><div class="section"><h3>ملاحظات المطعم</h3><textarea id="staffNote" class="staffnote">${esc(selected.staff_notes||'')}</textarea><button id="saveNote" class="btn" style="margin-top:8px">حفظ الملاحظة</button></div><div class="section"><h3>حالة الحجز</h3><div class="states">${['new','confirmed','arrived','completed','cancelled'].map(s=>`<button class="state" data-s="${s}">${rLabels[s]}</button>`).join('')}</div></div>`}$('#drawer').classList.add('open');$('#saveNote').onclick=saveNote;$$('.state').forEach(b=>b.onclick=()=>setStatus(b.dataset.s))}
async function setStatus(status){const base=selected._type==='order'?'/api/restaurant/table-orders/':'/api/restaurant/reservations/';await api(base+selected.id+'/status',{method:'PATCH',body:JSON.stringify({status})});$('#drawer').classList.remove('open');await load()}async function saveNote(){const base=selected._type==='order'?'/api/restaurant/table-orders/':'/api/restaurant/reservations/';await api(base+selected.id+'/notes',{method:'PATCH',body:JSON.stringify({staffNotes:$('#staffNote').value})});await load();openDetail(selected._type,selected.id)}
function makeQr(){const count=Math.max(1,Math.min(100,Number($('#tableCount').value)||1)),base=location.origin+'/';$('#qrGrid').innerHTML=Array.from({length:count},(_,i)=>{const table=i+1,url=base+'?table='+table,qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(url);return`<div class="qrCard"><img src="${qr}" alt="QR طاولة ${table}"><b>طاولة ${table}</b><small>${esc(url)}</small></div>`}).join('')}
$('#makeQr').onclick=makeQr;$('#printQr').onclick=()=>{if(!$('#qrGrid').children.length)makeQr();setTimeout(()=>window.print(),100)};$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/restaurant/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';await load()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/restaurant/logout',{method:'POST'});location.reload()};$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#drawer').onclick=e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('open')};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render();if(view==='qr'&&!$('#qrGrid').children.length)makeQr()});$('#search').oninput=render;load();setInterval(load,5000);
</script></body></html>
