<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المطعم — Café Victor Hugo</title>
<style>
:root{--bg:#0d0d0e;--panel:#171719;--panel2:#202023;--text:#f7f3ea;--muted:#aaa59b;--line:#323237;--gold:#d7b56d;--green:#3fc57c;--red:#ff6b6b;--blue:#69a9ff;--orange:#ffb45d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand h1{margin:0;font-size:24px}.brand p{margin:3px 0 0;color:var(--muted)}button{border:0;cursor:pointer}.logout,.btn{border-radius:12px;padding:10px 14px;background:var(--gold);color:#19150d;font-weight:800}.login{max-width:390px;margin:14vh auto;background:var(--panel);padding:24px;border:1px solid var(--line);border-radius:20px}.login h2{margin-top:0}.login input,.field input,.field textarea,.field select,.search,.staffnote{width:100%;border:1px solid var(--line);background:#101012;color:var(--text);border-radius:12px;padding:11px}.login button{width:100%;margin-top:10px}.error{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{padding:9px 12px;border-radius:999px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.tab.active{background:var(--gold);color:#18130c}.search{max-width:360px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}.card.new{box-shadow:inset 0 0 0 1px var(--gold)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.code{font-weight:900}.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:#29292c}.badge.new{color:var(--gold)}.badge.preparing,.badge.confirmed{color:var(--orange)}.badge.ready,.badge.arrived{color:var(--green)}.badge.cancelled{color:var(--red)}.tableNo,.name{font-size:20px;font-weight:900;margin:10px 0}.meta,.note{color:var(--muted);line-height:1.8}.note{margin-top:8px}.pre{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.item{padding:8px 0;border-bottom:1px dashed var(--line)}.mod{color:var(--red);font-weight:800}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}.drawer{position:fixed;inset:0;background:#0008;z-index:30;display:none;justify-content:flex-start}.drawer.open{display:flex}.drawerPanel{width:min(560px,94vw);height:100%;overflow:auto;background:#111113;border-left:1px solid var(--line);padding:18px}.drawerHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#111113;padding:18px 0 10px;z-index:2}.close{background:#28282c;color:#fff;border-radius:50%;width:38px;height:38px}.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px}.section h3{margin:0 0 10px}.kv{display:flex;justify-content:space-between;gap:16px;padding:6px 0}.states{display:flex;gap:7px;flex-wrap:wrap}.state{background:#29292d;color:#fff;padding:9px 11px;border-radius:10px}.state:hover{outline:1px solid var(--gold)}.total{color:var(--gold);font-weight:900}.qrPanel,.menuPanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.qrTools,.menuTools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.qrTools input{width:130px;background:#101012;color:#fff;border:1px solid var(--line);padding:10px;border-radius:10px}.qrGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.qrCard{background:#fff;color:#111;padding:12px;border-radius:14px;text-align:center}.qrCard img{width:100%;max-width:220px}.qrCard small{display:block;direction:ltr;word-break:break-all}.menuList{display:grid;gap:8px}.menuRow{display:grid;grid-template-columns:72px minmax(180px,1.4fr) minmax(120px,.8fr) 100px 110px 150px;gap:8px;align-items:center;background:#111113;border:1px solid var(--line);padding:9px;border-radius:14px}.menuThumb{width:64px;height:54px;object-fit:cover;border-radius:9px;background:#29292c;display:grid;place-items:center}.menuName b{display:block}.menuName small{color:var(--muted)}.availability{font-size:12px;font-weight:900}.availability.on{color:var(--green)}.availability.off{color:var(--red)}.miniBtns{display:flex;gap:5px;flex-wrap:wrap}.mini{padding:7px 9px;border-radius:9px;background:#29292d;color:#fff}.mini.danger{color:var(--red)}.mini.restore{color:var(--green)}.menuCount{color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;place-items:center;padding:16px}.modal.open{display:grid}.modalBox{width:min(780px,96vw);max-height:94vh;overflow:auto;background:#151517;border:1px solid var(--line);border-radius:20px;padding:18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:13px}.checks{display:flex;gap:18px;align-items:center}.checks label{display:flex;gap:7px;align-items:center}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.ghost{background:#2a2a2e;color:#fff;border-radius:12px;padding:10px 14px}.toast{position:fixed;left:20px;bottom:20px;background:#26262a;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:60;display:none}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.menuRow{grid-template-columns:60px 1fr 90px}.menuRow .hideMobile{display:none}.formGrid{grid-template-columns:1fr}.field.full{grid-co </style></head><body>
<div id="login" class="login hidden"><h2>دخول لوحة المطعم</h2><p style="color:var(--muted)">الطلبات والحجوزات والمنيو</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button class="btn">دخول</button><p id="loginError" class="error"></p></form></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand"><h1>Café Victor Hugo</h1><p>لوحة تشغيل المطعم</p></div><button class="logout" id="logout">تسجيل الخروج</button></div>
<div class="stats"><div class="stat"><b id="sTableNew">0</b><span>طلبات جديدة</span></div><div class="stat"><b id="sToday">0</b><span>حجوزات اليوم</span></div><div class="stat"><b id="sGuests">0</b><span>ضيوف اليوم</span></div><div class="stat"><b id="sSales">0 ر.س</b><span>طلبات نشطة</span></div></div>
<div class="toolbar"><div class="tabs"><button class="tab active" data-view="tables">🧾 الطلبات</button><button class="tab" data-view="today">📅 حجوزات اليوم</button><button class="tab" data-view="upcoming">القادمة</button><button class="tab" data-view="archive">الأرشيف</button><button class="tab" data-view="menu">🍽️ إدارة المنيو</button><button class="tab" data-view="qr">QR الطاولات</button></div><input id="search" class="search" placeholder="بحث..."></div>
<div id="grid" class="grid"></div>
<div id="menuPanel" class="menuPanel hidden"><div class="menuTools"><button class="btn" id="addMenu">+ إضافة صنف</button><span id="menuCount" class="menuCount"></span></div><div id="menuList" class="menuList"></div></div>
<div id="qrPanel" class="qrPanel hidden"><div class="qrTools"><input id="tableCount" type="number" min="1" max="100" value="20"><button class="btn" id="makeQr">إنشاء QR</button><button class="ghost" id="printQr">طباعة</button></div><div id="qrGrid" class="qrGrid"></div></div></div>
<div id="drawer" class="drawer"><aside class="drawerPanel"><div class="drawerHead"><h2 id="dTitle"></h2><button class="close" id="close">×</button></div><div id="detail"></div></aside></div>
<div id="menuModal" class="modal"><div class="modalBox"><div class="row"><h2 id="menuModalTitle">تعديل الصنف</h2><button class="close" id="menuModalClose">×</button></div><form id="menuForm"><input type="hidden" id="mKey"><input type="hidden" id="mCustom"><div class="formGrid">
<div class="field"><label>القسم</label><input id="mCategory" required></div><div class="field"><label>السعر الأساسي (مثال 22.00 DT أو —)</label><input id="mPrice" required></div>
<div class="field"><label>السعرات الحرارية (kcal)</label><input id="mCalories" type="number" min="0" max="10000" placeholder="مثال 450"></div><div class="field"><label>ترتيب الصنف داخل القسم</label><input id="mSortOrder" type="number" value="0"></div>
<div class="field"><label>ترتيب القسم</label><input id="mCategorySortOrder" type="number" value="0"></div><div class="field"><label>رابط الصورة</label><input id="mImage" type="url" placeholder="https://..."></div>
<div class="field"><label>الاسم الفرنسي / الأساسي</label><input id="mNameFr" required></div><div class="field"><label>الاسم العربي</label><input id="mNameAr"></div><div class="field"><label>الاسم الإنجليزي</label><input id="mNameEn"></div><div></div>
<div class="field full"><label>الوصف الفرنسي / الأساسي</label><textarea id="mDescFr" rows="2"></textarea></div><div class="field full"><label>الوصف العربي</label><textarea id="mDescAr" rows="2"></textarea></div><div class="field full"><label>الوصف الإنجليزي</label><textarea id="mDescEn" rows="2"></textarea></div>
<div class="field full"><label>الإضافات المدفوعة — كل سطر: الاسم | السعر (مثال: جبن إضافي | 3.00 DT)</label><textarea id="mAddons" rows="4" placeholder="جبن إضافي | 3.00 DT&#10;صوص إضافي | 2.00 DT"></textarea></div>
<div class="field full"><label>الخيارات والتعديلات — كل سطر: الاسم | السعر الاختياري (مثال: بدون مايونيز | 0)</label><textarea id="mOptions" rows="4" placeholder="بدون مايونيز | 0&#10;بدون بصل | 0&#10;حجم كبير | 4.00 DT"></textarea></div>
<div class="field full checks"><label><input id="mActive" type="checkbox" checked> متوفر للطلب</label><label><input id="mVisible" type="checkbox" checked> ظاهر في المنيو</label><label><input id="mSignature" type="checkbox"> Signature</label></div></div><div class="formActions"><button type="button" class="ghost" id="menuCancel">إلغاء</button><button class="btn">حفظ الصنف</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let reservations=[],orders=[],menuItems=[],view='tables',selected=null,firstLoad=true,lastOrderIds=new Set();
const rLabels={new:'جديد',confirmed:'مؤكد',arrived:'وصل',completed:'مكتمل',cancelled:'ملغي'},oLabels={new:'جديد',preparing:'جاري التحضير',ready:'جاهز',served:'تم التسليم',cancelled:'ملغي'};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401)throw Object.assign(new Error('AUTH'),{auth:true});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.message||'حدث خطأ');return j}function money(n){return(Number(n)||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dt(v){return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}).format(new Date(v))}function time(v){return new Intl.DateTimeFormat('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}).format(new Date(v))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1800)}function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},180)}catch{}}
async function load(){try{const req=[api('/api/restaurant/reservations'),api('/api/restaurant/table-orders')];if(view==='menu'||!menuItems.length)req.push(api('/api/restaurant/menu'));const [r,o,m]=await Promise.all(req);reservations=r.reservations||[];orders=o.orders||[];if(m)menuItems=m.items||[];$('#login').classList.add('hidden');$('#app').classList.remove('hidden');const ids=new Set(orders.filter(x=>x.status==='new').map(x=>x.id));if(!firstLoad&&[...ids].some(x=>!lastOrderIds.has(x)))beep();lastOrderIds=ids;firstLoad=false;render()}catch(e){if(e.auth){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}else console.error(e)}}
function render(){const today=reservations.filter(x=>x.bucket==='today'&&!['completed','cancelled'].includes(x.status)),todayOrders=orders.filter(x=>x.bucket==='today'),activeOrders=todayOrders.filter(x=>!['served','cancelled'].includes(x.status));$('#sTableNew').textContent=todayOrders.filter(x=>x.status==='new').length;$('#sToday').textContent=today.length;$('#sGuests').textContent=today.reduce((a,x)=>a+Number(x.party_size||0),0);$('#sSales').textContent=money(activeOrders.reduce((a,x)=>a+Number(x.order_total_sar||0),0)+today.reduce((a,x)=>a+Number(x.order_total_sar||0),0));$('#grid').classList.toggle('hidden',['qr','menu'].includes(view));$('#qrPanel').classList.toggle('hidden',view!=='qr');$('#menuPanel').classList.toggle('hidden',view!=='menu');if(view==='qr')return;if(view==='menu'){renderMenu();return}const q=$('#search').value.trim().toLowerCase();let rows=view==='tables'?activeOrders.map(x=>({...x,_type:'order'})):reservations.filter(x=>x.bucket===view&&(view!=='today'||!['completed','cancelled'].includes(x.status))).map(x=>({...x,_type:'reservation'}));if(q)rows=rows.filter(x=>[x.table_number,x.order_code,x.confirmation_code,x.customer_name,x.phone].some(v=>String(v||'').toLowerCase().includes(q)));$('#grid').innerHTML=rows.length?rows.map(x=>x._type==='order'?orderCard(x):reservationCard(x)).join(''):'<div class="empty">لا توجد عناصر في هذا القسم.</div>';$$('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.type,Number(c.dataset.id)))}
function orderCard(x){const external=x.order_mode==='external'||x.table_number==='OUTSIDE',dinein=x.order_mode==='dinein'||x.table_number==='DINEIN',modeLabel=external?'🌐 استلام خارجي':dinein?'🍽️ أكل داخل المطعم':'🪑 طاولة '+esc(x.table_number),preview=(x.order_items||[]).slice(0,4).map(i=>`<div class="item"><b>${Number(i.quantity)||1} × ${esc(i.name)}</b>${i.specialRequest?` <span class="mod">(${esc(i.specialRequest)})</span>`:''}</div>`).join('');return`<article class="card ${x.status==='new'?'new':''}" data-type="order" data-id="${x.id}"><div class="row"><span class="code">طلب #${esc(x.order_code)}</span><span class="badge ${esc(x.status)}">${oLabels[x.status]||esc(x.status)}</span></div><div class="tableNo">${modeLabel}</div>${(external||dinein)&&x.customer_name?`<div class="meta"><b>${esc(x.customer_name)}</b>${x.phone?' — '+esc(x.phone):''}</div>`:''}<div class="meta">🕐 ${time(x.created_at)}</div>${preview}<div class="pre"><span>الإجمالي</span><strong>${money(x.order_total_sar)}</strong></div></article>`}
function reservationCard(x){const has=(x.order_items||[]).length>0;return`<article class="card ${x.status==='new'?'new':''}" data-type="reservation" data-id="${x.id}"><div class="row"><span class="code">حجز #${esc(x.confirmation_code)}</span><span class="badge ${esc(x.status)}">${rLabels[x.status]||esc(x.status)}</span></div><div class="name">${esc(x.customer_name)}</div><div class="meta">🕐 ${time(x.reservation_at)}<br>👥 ${x.party_size} أشخاص<br>📞 <bdi>${esc(x.phone)}</bdi></div><div class="pre"><span>${has?'🛒 طلب مسبق':'لا يوجد طلب مسبق'}</span><strong>${money(x.order_total_sar)}</strong></div></article>`}
function itemsHtml(items){return(items||[]).length?(items||[]).map(i=>`<div class="item"><b>${Number(i.quantity)||1} × ${esc(i.name)}</b>${i.specialRequest?` <span class="mod">(${esc(i.specialRequest)})</span>`:''}<div class="meta">${i.unitPriceSar!=null?money(Number(i.unitPriceSar)*(Number(i.quantity)||1)):''}</div></div>`).join(''):'<span class="meta">لا توجد أصناف</span>'}
function openDetail(type,id){selected=type==='order'?orders.find(x=>x.id===id):reservations.find(x=>x.id===id);if(!selected)return;selected._type=type;if(type==='order'){const external=selected.order_mode==='external'||selected.table_number==='OUTSIDE',dinein=selected.order_mode==='dinein'||selected.table_number==='DINEIN';$('#dTitle').textContent=external?`استلام خارجي — #${selected.order_code}`:dinein?`أكل داخل المطعم — #${selected.order_code}`:`طلب طاولة ${selected.table_number} — #${selected.order_code}`;$('#detail').innerHTML=`<div class="section"><h3>تفاصيل الطلب</h3>${itemsHtml(selected.order_items)}<div class="row"><b>الإجمالي</b><span class="total">${money(selected.order_total_sar)}</span></div></div><div class="section"><h3>ملاحظات العميل</h3>${selected.notes?esc(selected.notes):'<span class="meta">لا توجد</span>'}</div><div class="section"><h3>ملاحظات المطعم</h3><textarea id="staffNote" class="staffnote">${esc(selected.staff_notes||'')}</textarea><button id="saveNote" class="btn" style="margin-top:8px">حفظ الملاحظة</button></div><div class="section"><h3>حالة التنفيذ</h3><div class="states">${['new','preparing','ready','served','cancelled'].map(s=>`<button class="state" data-s="${s}">${oLabels[s]}</button>`).join('')}</div></div>`}else{$('#dTitle').textContent=`تفاصيل الحجز #${selected.confirmation_code}`;$('#detail').innerHTML=`<div class="section"><h3>بيانات العميل</h3><div class="kv"><span>الاسم</span><b>${esc(selected.customer_name)}</b></div><div class="kv"><span>الجوال</span><bdi>${esc(selected.phone)}</bdi></div><div class="kv"><span>عدد الأشخاص</span><b>${selected.party_size}</b></div><div class="kv"><span>الموعد</span><b>${dt(selected.reservation_at)}</b></div></div><div class="section"><h3>الطلب المسبق</h3>${itemsHtml(selected.order_items)}</div><div class="section"><h3>ملاحظات المطعم</h3><textarea id="staffNote" class="staffnote">${esc(selected.staff_notes||'')}</textarea><button id="saveNote" class="btn" style="margin-top:8px">حفظ الملاحظة</button></div><div class="section"><h3>حالة الحجز</h3><div class="states">${['new','confirmed','arrived','completed','cancelled'].map(s=>`<button class="state" data-s="${s}">${rLabels[s]}</button>`).join('')}</div></div>`}$('#drawer').classList.add('open');$('#saveNote').onclick=saveNote;$$('.state').forEach(b=>b.onclick=()=>setStatus(b.dataset.s))}
async function setStatus(status){const base=selected._type==='order'?'/api/restaurant/table-orders/':'/api/restaurant/reservations/';await api(base+selected.id+'/status',{method:'PATCH',body:JSON.stringify({status})});$('#drawer').classList.remove('open');toast('تم تحديث الحالة');await load()}async function saveNote(){const base=selected._type==='order'?'/api/restaurant/table-orders/':'/api/restaurant/reservations/';await api(base+selected.id+'/notes',{method:'PATCH',body:JSON.stringify({staffNotes:$('#staffNote').value})});toast('تم حفظ الملاحظة');await load();openDetail(selected._type,selected.id)}
function renderMenu(){const q=$('#search').value.trim().toLowerCase();let rows=menuItems;if(q)rows=rows.filter(x=>[x.category,x.nameFr,x.nameAr,x.nameEn,x.descriptionFr].some(v=>String(v||'').toLowerCase().includes(q)));$('#menuCount').textContent=`${rows.length} صنف`;$('#menuList').innerHTML=rows.length?rows.map(x=>`<div class="menuRow"><div>${x.imageUrl?`<img class="menuThumb" src="${esc(x.imageUrl)}" onerror="this.outerHTML='<div class=&quot;menuThumb&quot;>🍽️</div>'">`:'<div class="menuThumb">🍽️</div>'}</div><div class="menuName"><b>${esc(x.nameAr||x.nameFr)}</b><small>${esc(x.nameFr)} · ${esc(x.category)} · ${x.calories!=null?esc(x.calories)+' kcal':'السعرات غير محددة'}${Array.isArray(x.modifiers)&&x.modifiers.length?' · '+x.modifiers.length+' خيار/إضافة':''}</small></div><div class="hideMobile">${esc(x.priceText||'—')}</div><div class="availability ${x.active&&x.visible!==false?'on':'off'}">${x.visible===false?'مخفي':x.active?'متوفر':'غير متوفر'}</div><div class="hideMobile">${x.custom?'مضاف من اللوحة':'أساسي'}</div><div class="miniBtns"><button class="mini" data-edit="${esc(x.itemKey)}">تعديل</button>${x.active?`<button class="mini danger" data-remove="${esc(x.itemKey)}">${x.custom?'حذف':'إيقاف'}</button>`:`<button class="mini restore" data-restore="${esc(x.itemKey)}">استعادة</button>`}</div></div>`).join(''):'<div class="empty">لا توجد أصناف.</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>openMenuEditor(b.dataset.edit));$$('[data-remove]').forEach(b=>b.onclick=()=>removeMenuItem(b.dataset.remove));$$('[data-restore]').forEach(b=>b.onclick=()=>restoreMenuItem(b.dataset.restore))}
function modifierLines(items,type){return (Array.isArray(items)?items:[]).filter(x=>x.type===type).map(x=>`${x.name}${x.priceText?` | ${x.priceText}`:''}`).join('\n')}
function parseModifierLines(text,type){return String(text||'').split(/\n+/).map((line,i)=>{const parts=line.split('|');const name=(parts.shift()||'').trim();const priceText=parts.join('|').trim();return name?{type,name,priceText,sortOrder:i}:null}).filter(Boolean)}
function openMenuEditor(key=''){const x=key?menuItems.find(i=>i.itemKey===key):null;$('#menuModalTitle').textContent=x?'تعديل الصنف':'إضافة صنف';$('#mKey').value=x?.itemKey||'';$('#mCustom').value=x?String(Boolean(x.custom)):'true';$('#mCategory').value=x?.category||'';$('#mPrice').value=x?.priceText||'';$('#mCalories').value=x?.calories??'';$('#mSortOrder').value=x?.sortOrder??0;$('#mCategorySortOrder').value=x?.categorySortOrder??0;$('#mNameFr').value=x?.nameFr||'';$('#mNameAr').value=x?.nameAr||'';$('#mNameEn').value=x?.nameEn||'';$('#mImage').value=x?.imageUrl||'';$('#mDescFr').value=x?.descriptionFr||'';$('#mDescAr').value=x?.descriptionAr||'';$('#mDescEn').value=x?.descriptionEn||'';$('#mAddons').value=modifierLines(x?.modifiers,'addon');$('#mOptions').value=modifierLines(x?.modifiers,'option');$('#mActive').checked=x?Boolean(x.active):true;$('#mVisible').checked=x?x.visible!==false:true;$('#mSignature').checked=Boolean(x?.signature);$('#menuModal').classList.add('open')}
async function saveMenuItem(e){e.preventDefault();const modifiers=[...parseModifierLines($('#mAddons').value,'addon'),...parseModifierLines($('#mOptions').value,'option')];const body={itemKey:$('#mKey').value,custom:$('#mCustom').value==='true',category:$('#mCategory').value,priceText:$('#mPrice').value,calories:$('#mCalories').value,sortOrder:Number($('#mSortOrder').value)||0,categorySortOrder:Number($('#mCategorySortOrder').value)||0,nameFr:$('#mNameFr').value,nameAr:$('#mNameAr').value,nameEn:$('#mNameEn').value,imageUrl:$('#mImage').value,descriptionFr:$('#mDescFr').value,descriptionAr:$('#mDescAr').value,descriptionEn:$('#mDescEn').value,modifiers,active:$('#mActive').checked,visible:$('#mVisible').checked,signature:$('#mSignature').checked};await api('/api/restaurant/menu/save',{method:'POST',body:JSON.stringify(body)});$('#menuModal').classList.remove('open');toast('تم حفظ الصنف والإضافات والسعرات');menuItems=(await api('/api/restaurant/menu')).items||[];renderMenu()}
async function removeMenuItem(key){const x=menuItems.find(i=>i.itemKey===key);if(!confirm(x?.custom?'حذف هذا الصنف من المنيو؟':'إيقاف هذا الصنف عن الظهور للعميل؟'))return;await api('/api/restaurant/menu/remove',{method:'POST',body:JSON.stringify({itemKey:key})});toast(x?.custom?'تم حذف الصنف':'تم إيقاف الصنف');menuItems=(await api('/api/restaurant/menu')).items||[];renderMenu()}
async function restoreMenuItem(key){await api('/api/restaurant/menu/restore',{method:'POST',body:JSON.stringify({itemKey:key})});toast('تمت استعادة الصنف');menuItems=(await api('/api/restaurant/menu')).items||[];renderMenu()}
function makeQr(){const count=Math.max(1,Math.min(100,Number($('#tableCount').value)||1)),base=location.origin+'/';$('#qrGrid').innerHTML=Array.from({length:count},(_,i)=>{const table=i+1,url=base+'?table='+table,qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(url);return`<div class="qrCard"><img src="${qr}" alt="QR طاولة ${table}"><b>طاولة ${table}</b><small>${esc(url)}</small></div>`}).join('')}
$('#makeQr').onclick=makeQr;$('#printQr').onclick=()=>{if(!$('#qrGrid').children.length)makeQr();setTimeout(()=>window.print(),100)};$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/restaurant/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';await load()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/restaurant/logout',{method:'POST'});location.reload()};$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#drawer').onclick=e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('open')};$$('.tab').forEach(b=>b.onclick=async()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;if(view==='menu')menuItems=(await api('/api/restaurant/menu')).items||[];render();if(view==='qr'&&!$('#qrGrid').children.length)makeQr()});$('#search').oninput=render;$('#addMenu').onclick=()=>openMenuEditor();$('#menuForm').onsubmit=saveMenuItem;$('#menuModalClose').onclick=$('#menuCancel').onclick=()=>$('#menuModal').classList.remove('open');$('#menuModal').onclick=e=>{if(e.target===$('#menuModal'))$('#menuModal').classList.remove('open')};load();setInterval(()=>{if(view!=='menu')load()},5000);
</script></body></html>
